<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabriel Hub | Premium Key System</title>
    <!-- Importando fonte premium do Google -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;800&family=Fira+Code:wght@500&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ff6600;
            --primary-glow: rgba(255, 102, 0, 0.4);
            --bg-color: #09090b;
            --card-bg: rgba(20, 20, 25, 0.7);
            --text-main: #ffffff;
            --text-muted: #888899;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Poppins', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Efeito de Luz no Fundo (Premium Glow) */
        .ambient-light {
            position: absolute;
            width: 40vw;
            height: 40vw;
            background: radial-gradient(circle, var(--primary-glow) 0%, rgba(0,0,0,0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 0;
            pointer-events: none;
            animation: pulseLight 6s infinite alternate ease-in-out;
        }

        @keyframes pulseLight {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.1); }
        }

        /* Container Principal (Glassmorphism) */
        .glass-panel {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 102, 0, 0.15);
            border-radius: 20px;
            padding: 40px;
            width: 90%;
            max-width: 450px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5), inset 0 0 0 1px rgba(255, 255, 255, 0.05);
            z-index: 1;
            transform: translateY(20px);
            opacity: 0;
            animation: slideUp 0.8s forwards cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        @keyframes slideUp {
            to { transform: translateY(0); opacity: 1; }
        }

        /* Cabeçalho do Card */
        .header {
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: 1px;
            text-transform: uppercase;
            background: linear-gradient(90deg, #ffffff, var(--primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .badge {
            display: inline-block;
            background: rgba(255, 102, 0, 0.1);
            color: var(--primary);
            border: 1px solid var(--primary);
            padding: 4px 12px;
            border-radius: 50px;
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-top: 10px;
        }

        /* Spinner Moderno */
        #loader {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 150px;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top-color: var(--primary);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
            box-shadow: 0 0 15px var(--primary-glow);
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        #loader p {
            color: var(--text-muted);
            font-size: 14px;
            animation: pulseText 1.5s infinite;
        }

        @keyframes pulseText {
            0%, 100% { opacity: 0.6; }
            50% { opacity: 1; }
        }

        /* Conteúdo da Key */
        #content {
            display: none;
            animation: fadeIn 0.5s forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
            margin-bottom: 20px;
        }

        /* Caixa da Chave Otimizada */
        .key-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 20px;
            border-radius: 12px;
            font-family: 'Fira Code', monospace;
            font-size: 28px;
            color: var(--primary);
            letter-spacing: 3px;
            margin-bottom: 25px;
            box-shadow: inset 0 2px 10px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }

        .key-box:hover {
            border-color: var(--primary-glow);
            text-shadow: 0 0 10px var(--primary-glow);
        }

        /* Botão Premium */
        .btn-copy {
            background: linear-gradient(135deg, var(--primary), #e65c00);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-family: 'Poppins', sans-serif;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px var(--primary-glow);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn-copy:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 102, 0, 0.6);
            background: linear-gradient(135deg, #ff7b22, var(--primary));
        }

        .btn-copy:active {
            transform: translateY(1px);
        }

        /* Estado de Sucesso */
        .success-state {
            background: linear-gradient(135deg, #00b09b, #96c93d) !important;
            box-shadow: 0 4px 15px rgba(0, 176, 155, 0.4) !important;
        }
    </style>
</head>
<body>

    <!-- Luz de Fundo Premium -->
    <div class="ambient-light"></div>

    <!-- Painel Principal -->
    <div class="glass-panel">
        <div class="header">
            <h1>Gabriel Hub</h1>
            <div class="badge">Acesso Premium</div>
        </div>

        <div id="loader">
            <div class="spinner"></div>
            <p>Autenticando Conexão...</p>
        </div>

        <div id="content">
            <p class="subtitle">Sua chave de acesso foi gerada com sucesso. Ela expira em 24 horas.</p>
            
            <div class="key-box" id="key-display">GERANDO...</div>
            
            <button class="btn-copy" id="copy-btn" onclick="copiar()">
                Copiar Chave
            </button>
        </div>
    </div>

    <script>
        const linkEncurtador = "https://linkvertise.com/6086616/hrldYG0Le5E4?o=sharing";

        // Verifica se a URL tem ?admin=1
        const urlParams = new URLSearchParams(window.location.search);
        
        window.onload = function() {
            // Lógica de Admin
            if (urlParams.get('admin') === '1') {
                localStorage.setItem("admin_auth", "true");
            }

            // Lógica de Bloqueio (Referrer)
            if (document.referrer === "" && localStorage.getItem("admin_auth") !== "true") {
                window.location.href = linkEncurtador;
                return;
            }

            // Simula o tempo de carregamento para efeito visual
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
                document.getElementById('content').style.display = 'block';
                
                const now = new Date();
                
                // === FÓRMULA MATEMÁTICA DE SEGURANÇA ===
                const d = now.getDate();
                const m = now.getMonth() + 1;
                const y = now.getFullYear();
                
                const secretFormula = (d * 583) + (m * 921) + ((y % 100) * 73);
                const dailyKey = "G-" + secretFormula.toString(16).toUpperCase();
                
                document.getElementById('key-display').innerText = dailyKey;
            }, 2500); // 2.5 segundos de "Autenticando..."
        }

        function copiar() {
            const keyText = document.getElementById('key-display').innerText;
            const btn = document.getElementById('copy-btn');
            
            if (keyText !== "GERANDO..." && btn.innerText !== "✔ CHAVE COPIADA!") {
                navigator.clipboard.writeText(keyText);
                
                // Animação de sucesso no botão
                btn.classList.add('success-state');
                btn.innerText = "✔ CHAVE COPIADA!";
                
                // Retorna ao estado original após 2 segundos
                setTimeout(() => { 
                    btn.classList.remove('success-state');
                    btn.innerText = "COPIAR CHAVE";
                }, 2000);
            }
        }
    </script>
</body>
</html>
